name: Magpaste
options:
  bundleIdPrefix: com.sulsira
  deploymentTarget:
    macOS: "14.0"
targets:
  Magpaste:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sulsira.Magpaste
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Magpaste needs to control other apps to paste your clipboard history back in."
        INFOPLIST_KEY_CFBundleDisplayName: Magpaste
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Carbon.framework
